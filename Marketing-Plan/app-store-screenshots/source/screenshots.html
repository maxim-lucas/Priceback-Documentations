const MFR = {Sep:"sept.", Oct:"oct."};
const U = L.ui;

   <div class="card mt row"><div class="ico" style="background:#fef3c7">⭐</div><div class="grow"><div class="nm" style="font-size:16px">${U.gold}</div><div class="meta">${U.goldSub}</div></div><div class="radio"></div></div>

    <div class="meta" style="font-size:20px">${d[2] ? "🔔" : "👀"}</div></div>`).join("")}
  </div>`,
 /* 8 Notifications */ () => `<div class="dark" style="height:1000px;background:radial-gradient(80% 40% at 50% 0%,rgba(16,185,129,.35),transparent 70%),linear-gradient(170deg,#12332a,#05110c)">${status(true)}
   <div style="text-align:center;color:#fff;margin-top:34px"><div style="font-size:15px;opacity:.8">${U.dateLong}</div><div style="font-size:84px;font-weight:300;letter-spacing:-2px;line-height:1.05">9:41</div></div>
   <div class="pad" style="margin-top:44px">${[[U.p1t,U.p1b,U.now],[U.p2t,U.p2b,U.min],[U.p3t,U.p3b,U.min]].map(n => `
    <div style="background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-radius:20px;padding:13px;margin-bottom:10px;color:#0d3d28" class="row">
     <img src="icon.png" style="width:38px;height:38px;border-radius:9px;flex:none"/>
     <div class="grow"><div class="row" style="justify-content:space-between"><b style="font-size:13.5px">${n[0]}</b><span class="meta">${n[2]}</span></div><div style="font-size:12.5px;line-height:1.3;margin-top:1px">${n[1]}</div></div></div>`).join("")}</div></div>`,
 /* 9 Savings */ () => `${status()}<div class="pad">
   <div class="title">${U.savings}</div>
   <div class="hero"><small>${U.totalFound}</small><b>$128.40</b><span>${U.claimed}: $86.50</span></div>
   <div class="card mt" style="height:190px;display:flex;align-items:flex-end;gap:14px;padding:16px 16px 10px">
     ${[28,44,36,70,100].map((h,i) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px"><div class="bar" style="height:${h}%"></div><span class="meta">${U.months[i]}</span></div>`).join("")}</div>
   <div class="card mt row"><div class="ico" style="background:#fef3c7">🔥</div><div class="grow nm" style="font-size:16px">${U.streak}</div></div>
  </div>`,
 /* 10 Privacy */ () => `${status()}<div class="pad" style="text-align:center">
   <div style="width:110px;height:110px;margin:22px auto 8px;border-radius:30px;background:linear-gradient(160deg,#10b981,#047857);display:flex;align-items:center;justify-content:center;font-size:56px;box-shadow:0 12px 30px rgba(16,185,129,.4)">🛡️</div>
   <div style="text-align:left">
   ${[["🔑",U.pv1,U.pv1s],["⬇️",U.pv2,U.pv2s],["🚫",U.pv3,U.pv3s]].map(p => `<div class="card mt row"><div class="ico">${p[0]}</div><div class="grow"><div class="nm">${p[1]}</div><div class="meta">${p[2]}</div></div></div>`).join("")}
   </div>
   <div class="row mt" style="justify-content:center;margin-top:18px"><span class="chip g" style="font-size:13px;padding:6px 14px">${U.free}</span><span class="chip g" style="font-size:13px;padding:6px 14px">🍁 ${U.canada}</span></div>
   <div class="meta" style="margin-top:22px;font-size:11px;line-height:1.4">${L.disc}</div>
  </div>`
];
const THEMES = ["t-dark","t-mint","t-green","t-dark","t-mint","t-green","t-mint","t-dark","t-green","t-dark"];
// phone top: a little lower on slides with a 3-line headline
const PHONE_TOP = [900,900,900,900,900,900,900,900,900,900];

document.getElementById("root").innerHTML = SCREENS.map((fn, i) => {
  const [h, s] = L.s[i];
  return `<section class="slide ${THEMES[i]} ${ (!ONLY || ONLY === i+1) ? "on" : "" }" id="s${i+1}">
    <div class="head">${i === 0 ? `<div class="brand"><img src="icon.png"/><span>${L.brand}</span></div>` : ""}<h1>${h}</h1><div class="sub">${s}</div></div>
    <div class="phone" style="top:${PHONE_TOP[i] + (i === 0 ? 110 : 0)}px"><div class="screen"><div class="island"></div><div class="zoom">${fn()}</div></div></div>
    ${i === 9 ? `<div style="position:absolute;left:90px;right:90px;bottom:34px;text-align:center;font-size:30px;color:var(--s)"></div>` : ""}
  </section>`;
}).join("");
if (LANG === "fr") {
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => { n.nodeValue = n.nodeValue.replace(/\$(\d+)\.(\d{2})/g, "$1,$2 $"); });
}
</script>
</body>
