<!--
  One source for the launch creatives (Marketing-Plan/14-launch-campaign-stop-asking-the-group.md).
  ?f=poster|story|square|store1|store2|store3  &lang=en|fr
  Sizes: poster 1080x1350 (Meta feed 4:5) · story 1080x1920 (Stories / Reels 9:16) · square 1080x1080
         store* 1320x2868 (App Store 6.9"; Play takes the same PNG).
  Design tokens are the app's (src/components/spaces/tokens.js): bg #eef5f1, ink #0d3d28, accent #10b981,
  accentInk #15803d, lime #bef264. Fonts: Inter Tight (titles), Plus Jakarta Sans (body), IBM Plex Mono (receipt).

  .pname { font-family:var(--T); font-weight:800; letter-spacing:-.4px; }
  .pmeta { font-family:var(--J); font-weight:500; color:var(--sub); }

  .wh { display:flex; align-items:center; }

const tile = (s) => `<div style="width:${s}px;height:${s}px;border-radius:${s * 0.224}px;background:linear-gradient(155deg,#10b981,#047857);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 ${s * .12}px ${s * .3}px rgba(4,120,87,.35)">
  <svg width="${s * .686}" height="${s * .843}" viewBox="11 7 26 32"><g fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">${GLYPH.map((d) => `<path d="${d}"/>`).join("")}</g></svg></div>`;
const brand = (s, dark) => `<div class="brand">${tile(s)}<b style="font-size:${s * .62}px;${dark ? "color:#fff" : ""}">PriceBack</b>
  <div class="newpill" style="font-size:${s * .2}px;padding:${s * .14}px ${s * .26}px;margin-left:${s * .1}px"><span class="dot" style="width:${s * .14}px;height:${s * .14}px"></span>${L.newV}</div></div>`;

const AVC = [["#fde68a", "#92400e"], ["#bfdbfe", "#1e3a8a"], ["#fbcfe8", "#831843"], ["#ddd6fe", "#4c1d95"]];
const ini = (n) => n.split(" ").map((w) => w[0]).join("").replace(".", "");

function post(x, y, w, rot, k, nCm) {
  const cms = L.cms.slice(0, nCm).map(([n, t], i) => `<div class="cm" style="gap:${12 * k}px;margin-top:${12 * k}px;opacity:${1 - i * .2}">
     <div class="av" style="width:${46 * k}px;height:${46 * k}px;font-size:${17 * k}px;background:${AVC[i][0]};color:${AVC[i][1]}">${ini(n)}</div>
     <div class="bub" style="padding:${10 * k}px ${18 * k}px;font-size:${23 * k}px"><b style="font-size:${18 * k}px">${n}</b>${t}</div></div>`).join("");
  return `<div class="post" style="left:${x}px;top:${y}px;width:${w}px;padding:${30 * k}px ${34 * k}px ${30 * k}px;transform:rotate(${rot}deg)">
    <div class="hd"><div class="av" style="width:${64 * k}px;height:${64 * k}px;font-size:${24 * k}px;background:var(--limeSoft);color:#3f6212">${ini(L.who)}</div>
      <div><div class="who" style="font-size:${26 * k}px">${L.who}</div><div class="where" style="font-size:${20 * k}px">${L.where}</div></div></div>
    <div class="q" style="font-size:${33 * k}px;line-height:1.32;margin-top:${20 * k}px">${L.q}</div>
    <div class="count" style="font-size:${20 * k}px;margin-top:${20 * k}px;padding-bottom:${14 * k}px;border-bottom:2px solid #eef1f0"><span>💬 ${L.count}</span><span>↗ ${L.share}</span></div>
    ${cms}
  </div>`;
}

function answer(x, y, w, rot, k) {
  const rows = L.whs.map(([n, s, c, p]) => `<div class="wh" style="gap:${14 * k}px;margin-top:${16 * k}px">
      <span class="sdot" style="width:${14 * k}px;height:${14 * k}px;background:${c === "g" ? "#10b981" : "#ef4444"};box-shadow:0 0 0 ${5 * k}px ${c === "g" ? "rgba(16,185,129,.18)" : "rgba(239,68,68,.15)"}"></span>
      <div class="n" style="font-size:${24 * k}px">${n}<div style="font-family:var(--J);font-weight:600;font-size:${18 * k}px;color:${c === "g" ? "var(--accentInk)" : "#b91c1c"};margin-top:${2 * k}px">${s}</div></div>
      <div class="p" style="font-size:${28 * k}px">${p}</div></div>`).join("");
  return `<div class="ans" style="left:${x}px;top:${y}px;width:${w}px;padding:${28 * k}px ${32 * k}px ${26 * k}px;transform:rotate(${rot}deg)">
    <div class="top">${tile(36 * k)}<div class="app" style="font-size:${20 * k}px">${L.app}</div><span class="chip c-lime" style="font-size:${17 * k}px;padding:${7 * k}px ${14 * k}px">✓ ${L.answered}</span></div>
    <div class="prod" style="margin-top:${20 * k}px">
      <div class="ptile" style="width:${84 * k}px;height:${84 * k}px;background:#e0f2fe;font-size:${44 * k}px">${VAC(60 * k)}</div>
      <div style="flex:1"><div class="pname" style="font-size:${32 * k}px">${L.prod}</div><div class="pmeta" style="font-size:${20 * k}px;margin-top:${4 * k}px">${L.prodMeta}</div></div>
      <div class="save" style="font-size:${50 * k}px">${L.save}</div></div>
    <div class="dash" style="margin-top:${20 * k}px;margin-bottom:${2 * k}px"></div>
    ${rows}
    <div class="example" style="font-size:${15 * k}px;margin-top:${18 * k}px;text-align:right">${L.example}</div>
  </div>`;
}

function ticket(k, bg) {
  const nb = bg || "var(--ink)";
  return `<div class="ticket" style="border-radius:${24 * k}px">
    <div class="l" style="padding:${20 * k}px ${26 * k}px ${20 * k}px ${30 * k}px">
      <div class="cap" style="font-size:${15 * k}px">${L.cap}</div>
      <div class="code" style="font-size:${64 * k}px;margin-top:${6 * k}px">BLACK</div>
      <div class="perk" style="font-size:${21 * k}px;margin-top:${8 * k}px">${L.perk}</div></div>
    <div class="r" style="padding:0 ${24 * k}px;font-size:${18 * k}px;line-height:1.3;text-align:center">${L.until}</div>
    <span class="notch" style="width:${26 * k}px;height:${26 * k}px;top:-${13 * k}px;right:${calcNotch(k)}px;background:${nb}"></span>
    <span class="notch" style="width:${26 * k}px;height:${26 * k}px;bottom:-${13 * k}px;right:${calcNotch(k)}px;background:${nb}"></span>
  </div>`;
}
function calcNotch(k) { return 0; } // placed after layout, see fixNotches()
function fixNotches() {
  document.querySelectorAll(".ticket").forEach((t) => {
    const r = t.querySelector(".r"); const w = r.offsetWidth;
    t.querySelectorAll(".notch").forEach((n) => { n.style.right = (w - n.offsetWidth / 2 - 1.5) + "px"; });
  });
}

/* ---------- Meta feed 4:5, 1080x1350 ---------- */
function poster() {
  return `<div class="art" style="width:1080px;height:1350px">
    <div class="glow" style="width:620px;height:620px;right:-240px;top:-260px;background:rgba(16,185,129,.18)"></div>
    <div class="glow" style="width:420px;height:420px;left:-200px;top:380px;background:rgba(190,242,100,.35)"></div>
    <div style="position:absolute;left:60px;top:50px">${brand(64)}</div>
    ${post(52, 138, 740, -3, .9, 3)}
    ${answer(400, 404, 628, 2.2, .9)}
    <div class="panel" style="height:500px;border-radius:52px 52px 0 0;padding:44px 60px 0">
      <div class="glow" style="width:520px;height:520px;right:-220px;top:-300px;background:rgba(16,185,129,.28)"></div>
      <div class="h" style="font-size:${LANG === "fr" ? 64 : 72}px;line-height:1.0;letter-spacing:-2.6px;position:relative">${L.h1}<em>${L.h2}</em></div>
      <div class="sub" style="font-size:24.5px;line-height:1.36;margin-top:16px;max-width:960px;position:relative">${L.sub}</div>
      <div style="display:flex;align-items:center;gap:26px;margin-top:22px;position:relative">
        ${ticket(.86)}
        <div style="display:flex;flex-direction:column;gap:12px">
          <div class="btn" style="font-size:25px;padding:20px 28px">${L.btn} <span style="font-size:26px">→</span></div>
          <div class="trial" style="font-size:18px;line-height:1.35">${L.trial}</div></div>
      </div>
      <div class="legal" style="position:absolute;left:60px;right:60px;bottom:16px;font-size:14px">${L.legal}</div>
    </div></div>`;
}

/* ---------- Square 1:1, 1080x1080 (feed, Google Display square) ---------- */
function square() {
  return `<div class="art" style="width:1080px;height:1080px">
    <div class="glow" style="width:560px;height:560px;right:-220px;top:-240px;background:rgba(16,185,129,.18)"></div>
    <div style="position:absolute;left:56px;top:44px">${brand(56)}</div>
    ${post(48, 120, 640, -3, .78, 2)}
    ${answer(452, 270, 570, 2.2, .8)}
    <div class="panel" style="height:446px;border-radius:48px 48px 0 0;padding:40px 56px 0">
      <div class="h" style="font-size:${LANG === "fr" ? 58 : 64}px;line-height:1.0;letter-spacing:-2.4px">${L.h1}<em>${L.h2}</em></div>
      <div class="sub" style="font-size:22.5px;line-height:1.36;margin-top:14px">${L.sub}</div>
      <div style="display:flex;align-items:center;gap:24px;margin-top:20px">${ticket(.74)}
        <div class="btn" style="font-size:23px;padding:18px 26px">${L.btn} →</div></div>
      <div class="legal" style="position:absolute;left:56px;right:56px;bottom:14px;font-size:12.5px">${L.legal}</div>
    </div></div>`;
}

/* ---------- Stories / Reels 9:16, 1080x1920 (top 250 / bottom 340 kept clear of the platform UI) ---------- */
function story() {
  return `<div class="art" style="width:1080px;height:1920px">
    <div class="glow" style="width:760px;height:760px;right:-300px;top:-300px;background:rgba(16,185,129,.2)"></div>
    <div class="glow" style="width:520px;height:520px;left:-260px;top:700px;background:rgba(190,242,100,.35)"></div>
    <div style="position:absolute;left:0;right:0;top:150px;display:flex;justify-content:center">${brand(68)}</div>
    ${post(56, 262, 800, -3, .98, 3)}
    ${answer(336, 560, 690, 2.2, .98)}
    <div class="panel" style="height:880px;border-radius:60px 60px 0 0;padding:64px 64px 0">
      <div class="glow" style="width:620px;height:620px;right:-260px;top:-340px;background:rgba(16,185,129,.28)"></div>
      <div class="h" style="font-size:${LANG === "fr" ? 78 : 88}px;line-height:1.0;letter-spacing:-3.2px;position:relative">${L.h1}<em>${L.h2}</em></div>
      <div class="sub" style="font-size:31px;line-height:1.4;margin-top:26px;position:relative">${L.sub}</div>
      <div style="display:flex;align-items:center;gap:26px;margin-top:34px;position:relative">${ticket(1)}
        <div class="trial" style="font-size:23px;line-height:1.4;flex:1">${L.trial}</div></div>
      <div class="legal" style="margin-top:26px;font-size:16px;position:relative">${L.legal}</div>
    </div></div>`;
}

/* ---------- store screenshots 1320x2868 ---------- */
const sbar = `<div class="sb"><span>9:41</span><span>●●● ▲ ▮</span></div>`;
const tabs = (on) => `<div class="tabs">${L.tabs.map((t, i) => `<div class="${i === on ? "on" : ""} ${i === 2 ? "fab" : ""}"><i></i>${t}</div>`).join("")}</div>`;
const chips = (cs) => `<div class="rc">${cs.map(([c, t]) => `<span class="chip ${c}">${t}</span>`).join("")}</div>`;
const ico = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#5b6b7e" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>`;

function dealsScreen() {
  return `<div class="zoom">${sbar}<div class="scr">
    <div class="bt"><div class="badge">C</div><div class="stitle">${L.dealsTitle}</div><div class="sbtn">${ico(18)}</div></div>
    <div class="whsel">📍 ${L.wh} <span style="color:var(--subDim)">▾</span><span class="live"><span class="sdot" style="width:7px;height:7px;background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.2)"></span>${L.live}</span></div>
    <div class="pills"><div class="pl" style="display:flex;gap:4px">⚙ Filters · 1</div>${L.qp.map((p, i) => `<div class="pl ${i === 0 ? "on" : ""}">${p}</div>`).join("")}</div>
    <div class="lh">${L.listT}<span>${L.sort} ▾</span></div>
    ${L.deals.map(([e, bg, n, p, o, off, cs]) => `<div class="card"><div class="row">
      <div class="img" style="background:${bg}">${pic(e, 40)}</div>
      <div style="flex:1;min-width:0"><div class="rn">${n}</div><div class="rp"><b>${p}</b><s>${o}</s></div>${chips(cs)}</div>
      <div class="off">${off}</div></div></div>`).join("")}
  </div></div>${tabs(1)}`;
}
function whScreen() {
  return `<div class="zoom">${sbar}<div class="scr">
    <div class="bt"><div class="badge">C</div><div class="stitle">${L.whTitle}</div></div>
    <div class="whsel">📍 ${L.whPick} <span style="color:var(--subDim)">▾</span><span class="live" style="color:var(--sub)">#503</span></div>
    <div class="search typed">${ico(16)} ${L.typed}<span style="width:1.5px;height:16px;background:var(--accent);display:inline-block"></span></div>
    <div class="pills">${L.qp2.map((p, i) => `<div class="pl ${i === 2 ? "on" : ""}">${p}</div>`).join("")}</div>
    <div class="lh">${L.whListT}<span>${L.whSort} ▾</span></div>
    ${L.whRows.map(([e, bg, n, m, p, cs]) => `<div class="card"><div class="row">
      <div class="img" style="background:${bg}">${pic(e, 40)}</div>
      <div style="flex:1;min-width:0"><div class="rn">${n}</div><div class="rm">${m}</div>${chips(cs)}</div>
      <div class="tr">${p} <span style="color:var(--subDim);font-weight:600">›</span></div></div></div>`).join("")}
  </div></div>${tabs(1)}`;
}
function storeShot(a, b, c, sub, screen, theme) {
  return `<div class="art storeart" style="background:radial-gradient(100% 45% at 12% 0%, #ffffff, transparent 70%), linear-gradient(170deg,#e4f4ec 0%,#bfe8d3 100%)">
    <div class="glow" style="width:900px;height:900px;right:-420px;top:900px;background:rgba(190,242,100,.35)"></div>
    <div class="shead">${brand(92)}
      <div class="sh1">${a}<br>${b}${c ? `<em>${c}</em>` : ""}</div>
      <div class="ssub">${sub}</div></div>
    <div class="phone"><div class="screen"><div class="island"></div>${screen}</div></div>
  </div>`;
}
function store1() { return storeShot(L.s1a, L.s1b, L.s1c, L.s1sub, dealsScreen()); }
function store2() { return storeShot(L.s2a, `<span style="color:var(--accentInk)">${L.s2b}</span>`, "", L.s2sub, whScreen()); }

const R = { poster, story, square, store1, store2 }[F] || poster;
document.getElementById("root").innerHTML = R();
document.fonts.ready.then(() => { fixNotches(); document.body.dataset.ready = "1"; });
</script>
</body>
</html>
