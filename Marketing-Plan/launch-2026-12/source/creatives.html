  Sizes: poster 1080x1350 (Meta feed 4:5) · story 1080x1920 (Stories / Reels 9:16) · square 1080x1080
         store* 1320x2868 (App Store 6.9"; Play takes the same PNG).
  Design tokens are the app's (src/components/spaces/tokens.js): bg #eef5f1, ink #0d3d28, accent #10b981,
  accentInk #15803d, lime #bef264. Fonts: Inter Tight (titles), Plus Jakarta Sans (body), IBM Plex Mono (receipt).

function store2() { return storeShot(L.s2a, `<span style="color:var(--accentInk)">${L.s2b}</span>`, "", L.s2sub, whScreen()); }


/* ===================== ADS (Meta feed 4:5, Stories/Reels 9:16, square 1:1) =====================

   and the Install button under it. The previous info-sheet layouts stay as f=info4x5|info9x16|info1x1
   (organic posts, the carousel's last slide). */

const V = Number(q.get("v") || 1);
const ADVAR = {

}[LANG];

const AV = CAMP === "free" && V > 1 ? ((ADVAR[LANG] || ADVAR.en)[V] || null) : null;
if (AV) Object.assign(A, AV);

function phone(x, y, w, rot, inner) {
  const pad = w * .022, r = w * .16;
  return `<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${w * 2.16}px;transform:rotate(${rot}deg);border-radius:${r}px;background:#0b0f0d;padding:${pad}px;box-shadow:0 0 0 ${w * .005}px #2a3330, 0 40px 90px rgba(0,0,0,.45)">
    <div style="width:100%;height:100%;border-radius:${r - pad}px;overflow:hidden;position:relative;background:var(--bg)">
      <div style="position:absolute;top:${w * .028}px;left:50%;transform:translateX(-50%);width:${w * .27}px;height:${w * .075}px;border-radius:${w * .04}px;background:#000;z-index:9"></div>
      ${inner(w - 2 * pad)}</div></div>`;
}
const zoomed = (html, sw) => html.replace(/<div class="zoom">/, `<div class="zoom" style="zoom:${sw / 390}">`);
function lockScreen(sw) {
  const cards = A.n.map(([t, b, a], i) => `<div style="background:rgba(255,255,255,${i ? .78 : .94});border-radius:22px;padding:11px 13px;margin-top:8px;color:var(--ink);${i ? `transform:scale(${1 - i * .04});opacity:${1 - i * .2}` : ""}">
      <div style="display:flex;align-items:center;gap:7px;font-family:var(--J);font-weight:700;font-size:10.5px;color:var(--sub);letter-spacing:.4px">${tile(19)}${A.app}<span style="margin-left:auto;font-weight:500;letter-spacing:0">${A.now}</span></div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:6px"><div style="flex:1;min-width:0"><div style="font-family:var(--T);font-weight:800;font-size:14px">${t}</div>
        <div style="font-family:var(--J);font-weight:500;font-size:12px;color:#334155;line-height:1.35;margin-top:1px">${b}</div></div>
        <div style="font-family:var(--T);font-weight:800;font-size:19px;color:var(--accentInk);letter-spacing:-.4px">${a}</div></div></div>`).join("");
  return `<div style="zoom:${sw / 390};width:390px;height:844px;position:relative;background:radial-gradient(90% 50% at 80% 10%, rgba(190,242,100,.45), transparent 60%), linear-gradient(170deg,#10b981 0%,#065f46 55%,#062a1a 100%);color:#fff">
    <div class="sb" style="color:#fff"><span>9:41</span><span>●●● ▲ ▮</span></div>
    <div style="text-align:center;font-family:var(--J);font-weight:600;font-size:17px;margin-top:22px;opacity:.9">${A.date}</div>
    <div style="text-align:center;font-family:var(--T);font-weight:700;font-size:86px;letter-spacing:-2px;line-height:1">9:41</div>
    <div style="padding:22px 12px 0">${cards}</div></div>`;
}
function bubble(x, y, w, text, big, i, rot) {
  return `<div style="position:absolute;left:${x}px;top:${y}px;max-width:${w}px;display:flex;align-items:flex-end;gap:12px;transform:rotate(${rot}deg);z-index:5">
    <div class="av" style="width:${big ? 58 : 46}px;height:${big ? 58 : 46}px;font-size:${big ? 21 : 17}px;background:${AVC[i][0]};color:${AVC[i][1]};box-shadow:0 6px 14px rgba(0,0,0,.18)">${["JM", "MR", "SL"][i]}</div>
    <div style="background:#fff;border-radius:26px 26px 26px 8px;padding:${big ? "18px 22px" : "12px 20px"};font-family:var(--J);font-weight:${big ? 700 : 600};font-size:${big ? 27 : 25}px;line-height:1.3;color:#1c2b23;box-shadow:0 16px 36px rgba(6,42,26,.28)">${text}</div></div>`;
}
function freeSticker(x, y, d) {
  return `<div style="position:absolute;left:${x}px;top:${y}px;width:${d}px;height:${d}px;border-radius:50%;background:var(--lime);transform:rotate(-12deg);z-index:6;
      box-shadow:0 18px 40px rgba(6,42,26,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--inkDeep)">
    <div style="position:absolute;inset:${d * .05}px;border-radius:50%;border:${d * .012}px dashed rgba(6,42,26,.35)"></div>
    <div style="font-family:var(--T);font-weight:800;font-size:${d * .15}px;line-height:1">${A.s1}</div>
    <div style="font-family:var(--M);font-weight:700;font-size:${d * (A.s2.length > 4 ? .17 : .25)}px;letter-spacing:${d * .01}px;line-height:1.05">${A.s2}</div>
    <div style="font-family:var(--J);font-weight:800;font-size:${d * .075}px;margin-top:${d * .03}px">${A.s3}</div></div>`;
}
function blackSticker(x, y, k) {
  return `<div style="position:absolute;left:${x}px;top:${y}px;transform:rotate(-7deg);z-index:6;filter:drop-shadow(0 18px 30px rgba(0,0,0,.4))">${ticket(k, "transparent")}</div>`;
}


/* the footer band: download, website, follow (Maxim, 2026-11-27). Generic glyphs, never the stores' or Meta's badges. */
const GL = {

  play: (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3.5v17a1 1 0 0 0 1.5.9l14-8.5a1 1 0 0 0 0-1.8l-14-8.5A1 1 0 0 0 5 3.5z"/></svg>`,
  web: (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>`,
  ig: (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.2" fill="currentColor" stroke="none"/></svg>`,
  fb: (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.8v3h2.6V21h3.1z"/></svg>`,
};
function footer(c) {
  const k = c.fk, ic = 26 * k;
  const item = (g, t, strong) => `<span style="display:inline-flex;align-items:center;gap:${8 * k}px;font-family:var(--T);font-weight:${strong ? 800 : 700};font-size:${21 * k}px;color:var(--ink);white-space:nowrap">${g}${t}</span>`;
  const sep = `<span style="width:${2 * k}px;height:${30 * k}px;background:var(--border);display:inline-block"></span>`;
  return `<div style="position:absolute;left:${c.fx}px;right:${c.fx}px;top:${c.fy}px;z-index:8;background:#fff;border-radius:${26 * k}px;padding:${16 * k}px ${22 * k}px;
      box-shadow:0 18px 40px rgba(6,42,26,.35);display:flex;align-items:center;justify-content:space-between;gap:${12 * k}px">
    ${item(`<span style="display:inline-flex;gap:${4 * k}px">${GL.apple(ic)}${GL.play(ic * .85)}</span>`, FOOT.dl, true)}${sep}
    ${item(GL.web(ic), FOOT.web)}${sep}
    ${item(`<span style="display:inline-flex;gap:${4 * k}px">${GL.ig(ic)}${GL.fb(ic)}</span>`, `${FOOT.follow} @priceback.ca`)}</div>`;
}

/* per format: [W, H, logo{x,y,s}, head{y,size}, phone{x,y,w,rot}, stickers, bubbles/receipt, legal{y}] */
const ADL = {
  poster: { W: 1080, H: 1350, lx: 64, ly: 56, ls: 58, hy: 150, hs: 84, ss: 30, px: 452, py: 470, pw: 560, pr: 4,
            fs: [790, 350, 236], bub: [[36, 560, 500, 1], [70, 800, 0, 0], [100, 900, 0, 0]], bx: 60, by: 1010, bk: .82,
            rc: [40, 560, 420, -9, 1.05], ly2: 1170, fx: 40, fy: 1240, fk: 1 },
  story:  { W: 1080, H: 1920, lx: 72, ly: 250, ls: 64, hy: 360, hs: 84, ss: 33, px: 400, py: 800, pw: 640, pr: 4,
            fs: [770, 600, 260], bub: [[40, 1000, 540, 1], [70, 1190, 0, 0], [100, 1290, 0, 0]], bx: 56, by: 1240, bk: .92,
            rc: [36, 920, 440, -9, 1.1], ly2: 1420, fx: 48, fy: 1500, fk: 1.05 },
  square: { W: 1080, H: 1080, lx: 56, ly: 44, ls: 50, hy: 122, hs: 70, ss: 26, px: 540, py: 380, pw: 460, pr: 4,
            fs: [830, 270, 200], bub: [[36, 430, 520, 1], [70, 650, 0, 0], [100, 740, 0, 0]], bx: 50, by: 770, bk: .72,
            rc: [40, 440, 380, -9, .95], ly2: 930, fx: 32, fy: 990, fk: .92 },
};
function ad(fmt) {
  const c = ADL[fmt], free = CAMP === "free";
  const hl = Math.max(A.h1.length, A.h2.length * 1.06);
  const hs = hl > 30 ? c.hs * .72 : hl > 26 ? c.hs * .78 : hl > 24 ? c.hs * .86 : c.hs;
  const bg = free
    ? "radial-gradient(80% 50% at 95% 0%, rgba(255,255,255,.22), transparent 60%), radial-gradient(60% 40% at 0% 100%, rgba(190,242,100,.35), transparent 60%), linear-gradient(165deg,#10b981 0%,#047857 100%)"
    : "radial-gradient(80% 50% at 95% 0%, rgba(16,185,129,.38), transparent 60%), radial-gradient(60% 40% at 0% 100%, rgba(190,242,100,.18), transparent 60%), linear-gradient(165deg,#0d3d28 0%,#062a1a 100%)";
  const logo = `<div style="position:absolute;left:${c.lx}px;top:${c.ly}px;display:flex;align-items:center;gap:${c.ls * .28}px">${tile(c.ls)}<b style="font-family:var(--T);font-weight:800;font-size:${c.ls * .62}px;letter-spacing:-1px;color:#fff">PriceBack</b></div>`;
  const head = `<div style="position:absolute;left:${c.lx}px;right:${c.lx}px;top:${c.hy}px">
      <div style="font-family:var(--T);font-weight:800;font-size:${hs}px;line-height:1.0;letter-spacing:${-hs * .035}px;color:#fff">${A.h1}<span style="display:block;color:var(--lime)">${A.h2}</span></div>
      <div style="font-family:var(--J);font-weight:600;font-size:${c.ss}px;line-height:1.35;color:rgba(255,255,255,.9);margin-top:${c.ss * .6}px;max-width:${free ? c.fs[0] - c.lx - 24 : c.W * .8}px">${A.sub}</div></div>`;
  const legal = `<div style="position:absolute;left:${c.lx}px;top:${c.ly2}px;width:${free ? c.px - c.lx - 30 : c.W * .4}px;font-family:var(--J);font-weight:500;font-size:${c.W > 1000 && c.H > 1500 ? 16 : 14}px;line-height:1.35;color:rgba(255,255,255,.6);z-index:7">${A.legal}</div>`;
  let body;
  if (free) {
    body = phone(c.px, c.py, c.pw, c.pr, (sw) => zoomed(A.screen === "wh" ? whScreen() : dealsScreen(), sw))
      + c.bub.slice(0, A.b.length).map(([x, y, w, big], i) => bubble(x, y, big ? w : 420, A.b[i], big, i, i ? 0 : -2)).join("")
      + freeSticker(c.fs[0], c.fs[1], c.fs[2]);
  } else {
    const [rx, ry, rw, rr, rk] = c.rc;
    body = receipt(rx, ry, rw, rr, rk, "COSTCO WHOLESALE", "#542 MERIVALE · 2026-11-20", [["KS OLIVE OIL 2L", "21.99"], ["DYSON V15 DETECT", "919.99"], ["NINJA AF101", "129.99"], ["TIDE PODS 152", "34.99"]], "1,106.96", 1)
      + phone(c.px, c.py, c.pw, c.pr, lockScreen)
      + blackSticker(c.bx, c.by, c.bk);
  }
  return `<div class="art" style="width:${c.W}px;height:${c.H}px;background:${bg}">${logo}${head}${body}${legal}${footer(c)}</div>`;
}

const R = { poster: () => ad("poster"), story: () => ad("story"), square: () => ad("square"), info4x5: poster, info9x16: story, info1x1: square, store1, store2 }[F] || (() => ad("poster"));
document.getElementById("root").innerHTML = R();
document.fonts.ready.then(() => { fixNotches(); document.body.dataset.ready = "1"; });
</script>
